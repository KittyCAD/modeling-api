[workspace]
resolver = "2"
members = [
    "bumper",
    "modeling-cmds",
    "modeling-cmds-macros",
    "modeling-cmds-macros-impl",
    "modeling-session",
    "unit-conversion-derive",
]

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"

[workspace.dependencies]
kittycad = { version = "0.5", features = ["requests"] }
kittycad-modeling-cmds = { path = "modeling-cmds", version = "0.2.0" }
kittycad-modeling-cmds-macros = { path = "modeling-cmds-macros", version = "0.1.13" }
kittycad-modeling-cmds-macros-impl = { path = "modeling-cmds-macros-impl", version = "0.1.14" }
kittycad-modeling-session = { path = "modeling-session", version = "0.1.2" }
proc-macro2 = "1.0.106"
quote = "1.0.43"
syn = "3.0.3"

[patch.crates-io]
kittycad-unit-conversion-derive = { path = "unit-conversion-derive" }
kcl-api = { git = "https://github.com/KittyCAD/modeling-app", branch = "achalmers/traits-for-operations" }
kcl-error = { git = "https://github.com/KittyCAD/modeling-app", branch = "achalmers/traits-for-operations" }

[profile.bench]
debug = true
