on:
    workflow_dispatch:
    pull_request:
      paths:
        - '**.rs'
        - .github/workflows/ci.yml
        - Cargo.lock
        - Cargo.toml
        - '**/Cargo.toml'
        - rust-toolchain.toml
permissions: read-all
name: Rust CI
jobs:
    cargo-test:
      name: cargo test
      runs-on: ubuntu-latest-8-cores
      steps:
        - uses: actions/checkout@v7
        - name: Install Rust
          uses: dtolnay/rust-toolchain@stable
        - uses: taiki-e/install-action@cargo-llvm-cov
        - uses: taiki-e/install-action@nextest
        - uses: Swatinem/rust-cache@v2.9.2
        - uses: taiki-e/install-action@just

        - name: cargo test
          shell: bash
          run: |
            export ZOO_API_TOKEN=${{secrets.KITTYCAD_API_TOKEN}}
            just test-with-coverage
          env:
            RUST_BACKTRACE: 1
  
        - name: Upload to codecov.io
          uses: codecov/codecov-action@v7
          with:
            token: ${{secrets.CODECOV_TOKEN}}
            fail_ci_if_error: true
            flags: unittests
            verbose: true
            files: lcov.info
            
    maybe-redo-openapi:
      name: redo openapi.json on changes
      runs-on: ubuntu-latest-8-cores
      permissions:
        contents: write
      steps:
        - uses: actions/checkout@v7
          with:
            # Needed because GitHub actions checks out "synthetic merge commit" by default.
            # This gets us the actual HEAD ref we deal with normally.
            ref: ${{ github.head_ref }}
        - name: Install Python 3.12 development libraries
          run: |
            sudo apt-get update
            sudo apt-get install -y python3.12-dev
        - name: Install Rust
          uses: dtolnay/rust-toolchain@stable
        - uses: taiki-e/install-action@cargo-llvm-cov
        - uses: taiki-e/install-action@nextest
        - uses: Swatinem/rust-cache@v2.9.2
        - uses: taiki-e/install-action@just
        - name: just redo-openapi
          shell: bash
          run: |
            export ZOO_API_TOKEN=${{secrets.KITTYCAD_API_TOKEN}}
            just redo-openapi
            git status --porcelain | grep modeling-cmds/openapi/api.json && \
            git add modeling-cmds/openapi/api.json
        - name: Commit changes
          run: |
            git \
              -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Update OpenAPI specification"
            git push origin HEAD:${{ github.head_ref }}
          env:
            RUST_BACKTRACE: 1
  
    check-lint:
      name: Check lints
      runs-on: ubuntu-latest-8-cores
      steps:
        - uses: actions/checkout@v7
        - uses: taiki-e/install-action@just
        - name: Install Rust
          uses: dtolnay/rust-toolchain@stable
          with:
            components: clippy
        - uses: Swatinem/rust-cache@v2.9.2

        - name: Check lints
          run: just lint

    check-wasm:
      name: Check wasm
      runs-on: ubuntu-latest-8-cores
      steps:
        - uses: actions/checkout@v7
        - uses: taiki-e/install-action@just
        - name: Install Rust
          uses: dtolnay/rust-toolchain@stable
          with:
            targets: wasm32-unknown-unknown
        - uses: Swatinem/rust-cache@v2.9.2

        - name: Check lints
          run: just check-wasm
 
    cargo-fmt:
        name: cargo fmt
        runs-on: ubuntu-latest-8-cores
        steps:
          - uses: actions/checkout@v7
          - name: Install Rust
            uses: dtolnay/rust-toolchain@stable
            with:
                components: rustfmt
  
          - name: cargo fmt
            run: cargo fmt

    can-release:
        name: Check modeling-cmds can release
        runs-on: ubuntu-latest-8-cores
        steps:
          - uses: actions/checkout@v7
          - name: Install Rust
            uses: dtolnay/rust-toolchain@stable
          - name: Dry-run a release of modeling-cmds
            run: cargo publish -p kittycad-modeling-cmds --dry-run

    check-typos:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v7
        - name: Run codespell
          uses: crate-ci/typos@v1.49.0

    cargo-toml-sorted:
      name: Check Cargo.toml is sorted
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v7
        - name: Install cargo-sort
          run: cargo install cargo-sort
        - name: Run check
          run: cargo sort --workspace --check

